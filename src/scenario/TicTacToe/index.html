<!DOCTYPE html>
<html lang="en" class="simulator">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simulator</title>
        <link rel="stylesheet" href="/assets/app.css" />
        <script type="module">
            import { ScenarioWorker } from '/simulator/worker-utils.js';

            const displayContainer = document.getElementById('display');
            const worker = new ScenarioWorker(displayContainer, {
                captureEvents: {
                    mouseDown: true,
                    mouseUp: true,
                    mouseMove: true,
                    keyDown: false,
                    keyUp: false,
                    keyPress: false,
                },
            });
            window.worker = worker;

            const start = async () => {
                await worker.start();
                await worker.call('/project/index.js', 'start');
            }
            const terminate = async () => {
                await worker.terminate();
            }

            onload = start;
            document.getElementById('start').onclick = start;
            document.getElementById('terminate').onclick = terminate;
        </script>
    </head>
    <body>
        <header id="control">
            <button class="btn btn-sm btn-success" id="start">start&nbsp;/&nbsp;restart</button>
            <button class="btn btn-sm" id="train">call&nbsp;train</button>
            <button class="btn btn-sm btn-error" id="terminate">terminate</button>
        </header>
        <main id="display"></main>
    </body>
</html>
