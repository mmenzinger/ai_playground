<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>AI - Coding4Fun</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Coding4Fun Educational Artificial Intelligence Platform"
        />
        <link rel="icon" type="image/png" href="assets/logo.png" />
        <script type="module" src="/src/index.tsx"></script>
        <script>
            // Load and register pre-caching Service Worker
            if ('serviceWorker' in navigator) {
                onload = () => {
                    navigator.serviceWorker.register('/service-worker.js', { type: 'module' });
                };
            }
        </script>
        <style>
            html,
            body,
            #output {
                height: 100%;
                min-width: 30rem;
            }
            #output {
                display: flex;
                flex-direction: column;
            }
        </style>
    </head>

    <body>
        <div id="output"></div>
        <div id="notSupported" style="display: none">
            <p>
                Your browser does not provide the following required features:
            </p>
            <ul id="missing"></ul>
            <p>
                Currently only modern versions of Chromium-based browsers like
                <a href="https://www.google.com/chrome">Google Chrome</a> and
                <a href="https://www.microsoft.com/en-us/edge"
                    >Microsoft Edge</a
                >
                provide all necessary features.
            </p>
        </div>
        <noscript>
            This as a website about programming JavaScript. It can not function
            with JavaScript disabled... To continue enable JavaScript and
            reload.
        </noscript>
    </body>
</html>
